name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
  NEXT_PUBLIC_APPWRITE_PROJECT_ID: e2e-public-no-data
  APPWRITE_PROJECT_NAME: CI isolated placeholder
  APPWRITE_API_KEY: ci-no-access
  APPWRITE_DATABASE_ID: ebenertkd
  APPWRITE_STORAGE_BUCKET_ID: private-files
  APP_URL: http://127.0.0.1:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e-public:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep-invert @authenticated

  e2e-authenticated:
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ vars.E2E_APPWRITE_PROJECT_ID }}
      E2E_APPWRITE_PROJECT_ID: ${{ vars.E2E_APPWRITE_PROJECT_ID }}
      PRODUCTION_APPWRITE_PROJECT_ID: ${{ vars.PRODUCTION_APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.E2E_APPWRITE_API_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADULT_EMAIL: ${{ secrets.E2E_ADULT_EMAIL }}
      E2E_ADULT_PASSWORD: ${{ secrets.E2E_ADULT_PASSWORD }}
      E2E_GUARDIAN_EMAIL: ${{ secrets.E2E_GUARDIAN_EMAIL }}
      E2E_GUARDIAN_PASSWORD: ${{ secrets.E2E_GUARDIAN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:auth
