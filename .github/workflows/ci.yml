name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
  NEXT_PUBLIC_APPWRITE_PROJECT_ID: e2e-public-no-data
  APPWRITE_PROJECT_NAME: CI isolated placeholder
  APPWRITE_API_KEY: ci-no-access
  APPWRITE_DATABASE_ID: ebenertkd
  APPWRITE_STORAGE_BUCKET_ID: private-files
  APP_URL: http://127.0.0.1:3000

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  e2e-public:
    name: Public E2E smoke
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run public E2E checks
        run: npm run test:e2e -- --grep-invert @authenticated

  e2e-authenticated:
    name: Authenticated E2E
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ vars.E2E_APPWRITE_PROJECT_ID }}
      E2E_APPWRITE_PROJECT_ID: ${{ vars.E2E_APPWRITE_PROJECT_ID }}
      PRODUCTION_APPWRITE_PROJECT_ID: ${{ vars.PRODUCTION_APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.E2E_APPWRITE_API_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADULT_EMAIL: ${{ secrets.E2E_ADULT_EMAIL }}
      E2E_ADULT_PASSWORD: ${{ secrets.E2E_ADULT_PASSWORD }}
      E2E_GUARDIAN_EMAIL: ${{ secrets.E2E_GUARDIAN_EMAIL }}
      E2E_GUARDIAN_PASSWORD: ${{ secrets.E2E_GUARDIAN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run authenticated E2E checks
        run: npm run test:e2e:auth
