name: PR notifications

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - closed
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  github-notify:
    if: >-
      ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR or workflow status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const eventName = context.eventName;
            const repo = context.repo.repo;
            const owner = context.repo.owner;

            if (eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const action = context.payload.action;

              const body = `## 🔔 PR atualizado
              - Repositório: ${owner}/${repo}
              - PR: #${pr.number} — ${pr.title}
              - Ação: ${action}
              - Link: ${pr.html_url}

              > O fluxo de CI continua validando a mudança.`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
              return;
            }

            const workflow = context.payload.workflow_run;
            const conclusion = workflow.conclusion;
            const body = `## 🔔 Status do workflow
            - Workflow: ${workflow.name}
            - Conclusão: ${conclusion}
            - Link: ${workflow.html_url}

            > Status reportado automaticamente pelo GitHub Actions.`;

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: workflow.head_sha,
            });

            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }
