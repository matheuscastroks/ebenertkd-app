name: PR automation
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Add labels by area
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      - name: Add PR size label
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: 20
          s_max_size: 80
          m_max_size: 200
          l_max_size: 500
          fail_if_xl: false

      - name: Add review reminder comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = `## ✅ Checklist de PR
            - [ ] Revisa o escopo e impacto da mudança
            - [ ] Valida lint, typecheck e testes
            - [ ] Confere impacto em autorizações e regras de negócio
            - [ ] Verifica se há necessidade de documentação ou migration

            > Este PR foi marcado automaticamente para revisão humana.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const alreadyCommented = comments.data.some((comment) =>
              comment.user.type === 'Bot' && comment.body.includes('Checklist de PR')
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
