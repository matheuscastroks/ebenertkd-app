<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ebener TKD — coleção de ilustrações</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3f7;color:#252329;font:16px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px 16px}h1{font-size:28px}h2{font-size:21px;margin-top:36px}.refs{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.refs img{width:80px;border-radius:50%}.refs p{max-width:650px}button{font:inherit;padding:10px 16px;background:#f59300;border:0;border-radius:8px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.piece{margin:0;padding:20px;background:#fff;border-radius:16px;text-align:center;min-width:0}.piece img{width:144px;height:144px;object-fit:contain}.piece figcaption{margin-top:12px;font-weight:600}.piece small{display:block;overflow-wrap:anywhere;color:#6a646e}.dark{background:#1d1c20;color:#f4f1f7}.dark .piece{background:#2c2a30}.dark small{color:#c6c1cb}a{color:inherit}.subdued img{filter:grayscale(1);opacity:.6}@media(prefers-color-scheme:dark){body:not(.light){background:#1d1c20;color:#f4f1f7}body:not(.light) .piece{background:#2c2a30}body:not(.light) small{color:#c6c1cb}}
</style><main><h1>Ilustrações do Ebener TKD</h1>
<div class="refs"><img src="../../public/avatar-placeholder.webp" alt="Avatar masculino original"><img src="../../public/avatar-placeholder-feminino.webp" alt="Avatar feminino original"><p>Coleção baseada nos dois avatares originais. Personagens nas cenas e objetos nas conquistas; arquivos WebP com transparência, sem palavras ou metas desenhadas.</p></div>
<p><button id="theme">Alternar claro/escuro</button> <button id="locked">Comparar conquistas em progresso</button></p><p><a href="pilots.html">Ver composição dos pilotos em cards desktop e celular</a></p>
<div id="collection"></div></main>
<script>
const groups={
"Eventos":[["event-championship","Campeonato"],["event-belt-exam","Exame de faixa"],["event-seminar","Aulão ou seminário"],["event-social","Confraternização"],["event-other","Outro evento"]],
"Marcos de progresso":[["achievement-first-lesson","Primeiro treino"],["achievement-streak","Constância"],["achievement-perfect-month","Mês exemplar"],["achievement-lessons-25","Treinos — primeiro marco"],["achievement-lessons-50","Treinos — segundo marco"],["achievement-lessons-100","Treinos — terceiro marco"],["achievement-first-graduation","Primeira graduação"],["achievement-one-year","Um ano de Taekwondo"],["achievement-first-event","Primeiro evento"],["achievement-first-medal","Primeira medalha"]],
"Reconhecimentos":[["badge-participation","Participação em campeonato"],["badge-gold","Medalha de ouro"],["badge-silver","Medalha de prata"],["badge-bronze","Medalha de bronze"],["badge-exam-approved","Aprovação em exame"],["badge-seminar-attendance","Presença em aulão ou seminário"]],
"Estados vazios":[["empty-agenda","Agenda"],["empty-journey","Início da jornada"],["empty-achievements","Conquistas"],["empty-family","Família"],["empty-documents","Documentos"],["empty-classes","Turmas"]]
};
for(const [heading,pieces] of Object.entries(groups)){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=heading;section.append(h);const grid=document.createElement('div');grid.className='grid';for(const [name,label] of pieces){const figure=document.createElement('figure');figure.className='piece';if(name.startsWith('achievement-'))figure.dataset.achievement='true';const img=document.createElement('img');img.src='../../public/illustrations/'+name+'.webp';img.alt='';img.width=144;img.height=144;const caption=document.createElement('figcaption');caption.textContent=label;const small=document.createElement('small');small.textContent=name;figure.append(img,caption,small);grid.append(figure)}section.append(grid);document.getElementById('collection').append(section)}
document.getElementById('theme').onclick=()=>{const dark=document.body.classList.contains('dark')||(!document.body.classList.contains('light')&&matchMedia('(prefers-color-scheme:dark)').matches);document.body.classList.toggle('dark',!dark);document.body.classList.toggle('light',dark)};
document.getElementById('locked').onclick=()=>document.querySelectorAll('[data-achievement]').forEach(el=>el.classList.toggle('subdued'));
</script></html>
